[uwsgi]
procname-master = uwsgi %n
master = true
http-socket = :3008
buffer-size = 32768

plugins = python3

chdir = /opt/bitpoll
virtualenv = /opt/bitpoll/.venv

module = bitpoll.wsgi:application
env = DJANGO_SETTINGS_MODULE=bitpoll.settings
env = LANG='C.UTF-8'
env = LC_ALL='C.UTF-8'

; drop privileges
uid    = www-data
gid    = www-data
umask  = 027

; run with at least 2 process but increase up to 8 when needed
processes = 4
threads = 4
cheaper = 2

; disable uWSGI request logging
disable-logging = true

; serve static files
static-map = /static=/opt/static
